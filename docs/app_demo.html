<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>ChristAPI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* ---------- tokens ---------- */
        :root {
            --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
            --serif: "Source Serif 4", Georgia, "Times New Roman", serif;

            --brand: #2e4a8f;
            --brand-strong: #23396e;
            --brand-soft: #e7ecf8;
            --brass: #a9741f;
            --brass-soft: #f7efdd;
            --ok: #1f7a54;
            --ok-soft: #e2f4ec;
            --warn: #9a5b12;
            --warn-soft: #fbeedb;
            --bad: #ad3a33;
            --bad-soft: #fbe9e7;

            --ink: #141a2b;
            --ink-2: #414c66;
            --ink-3: #6b7793;
            --page: #eef1f6;
            --surface: #ffffff;
            --surface-2: #f6f8fc;
            --line: #dfe4ee;
            --line-strong: #c7cfdf;

            --spine: #151c2e;
            --spine-ink: #aab6d0;
            --spine-hover: #202a42;

            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 18px;
            --shadow-1: 0 1px 2px rgba(20, 26, 43, .06), 0 1px 1px rgba(20, 26, 43, .04);
            --shadow-2: 0 18px 44px rgba(20, 26, 43, .16);
            --sidebar-w: 248px;
        }

        :root[data-theme="dark"] {
            --brand: #7f9ce4;
            --brand-strong: #9db3ec;
            --brand-soft: #1d2947;
            --brass: #d9a94e;
            --brass-soft: #2b2313;
            --ok: #5cc196;
            --ok-soft: #14301f;
            --warn: #d79b4d;
            --warn-soft: #2e2213;
            --bad: #e9827a;
            --bad-soft: #35191a;

            --ink: #e8ecf6;
            --ink-2: #b6c0d6;
            --ink-3: #8b96b0;
            --page: #0d1220;
            --surface: #151b2b;
            --surface-2: #1b2234;
            --line: #26304a;
            --line-strong: #33405f;

            --spine: #0a0e19;
            --spine-ink: #97a3bf;
            --spine-hover: #1a2338;
            --shadow-1: none;
            --shadow-2: 0 18px 44px rgba(0, 0, 0, .55);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--page);
            color: var(--ink);
            font: 400 15px/1.55 var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; }
        h1 { font-size: 25px; }
        h2 { font-size: 19px; }
        h3 { font-size: 16px; }
        p { margin: 0 0 10px; }
        a { color: var(--brand); }

        .muted { color: var(--ink-3); }
        .small { font-size: 13px; }
        .hidden { display: none !important; }
        .stack { display: grid; gap: 16px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .spacer { flex: 1; }
        .nowrap { white-space: nowrap; }

        :focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ---------- controls ---------- */
        button, input, select, textarea { font: inherit; color: inherit; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid transparent;
            border-radius: var(--r-sm);
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            padding: 9px 14px;
            min-height: 38px;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn:hover { background: var(--brand-strong); }
        :root[data-theme="dark"] .btn { color: #0d1220; }
        .btn.ghost { background: transparent; border-color: var(--line-strong); color: var(--ink-2); }
        .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
        .btn.quiet { background: transparent; border-color: transparent; color: var(--brand); padding: 6px 8px; }
        .btn.quiet:hover { background: var(--brand-soft); }
        .btn.danger { background: var(--bad); }
        .btn.danger:hover { filter: brightness(.92); }
        .btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; }
        .btn[disabled] { cursor: not-allowed; opacity: .55; }
        .btn[aria-busy="true"] .spin { display: inline-block; }
        .spin {
            display: none;
            width: 13px; height: 13px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .field { display: grid; gap: 6px; min-width: 0; }
        .field > label { color: var(--ink-2); font-size: 13px; font-weight: 600; }
        .field .hint { color: var(--ink-3); font-size: 12px; }
        .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--bad); }
        .field .err { color: var(--bad); font-size: 12px; }

        input, select, textarea {
            width: 100%;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-sm);
            padding: 9px 11px;
            background: var(--surface);
            min-height: 38px;
        }
        input::placeholder, textarea::placeholder { color: var(--ink-3); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
        textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
        input[type="file"] { padding: 7px; background: var(--surface-2); }
        .check { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
        .check input { width: 17px; height: 17px; min-height: 0; accent-color: var(--brand); }

        /* ---------- surfaces ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            padding: 18px;
            box-shadow: var(--shadow-1);
        }
        .card > h2, .card > h3 { margin-bottom: 4px; }
        .card-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; }

        .grid { display: grid; gap: 16px; }
        .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            border-radius: 99px; padding: 3px 9px;
            background: var(--surface-2); color: var(--ink-2);
            border: 1px solid var(--line);
            font-size: 12px; font-weight: 600; white-space: nowrap;
        }
        .badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
        .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
        .badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
        .badge.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
        .badge.brass { background: var(--brass-soft); color: var(--brass); border-color: transparent; }

        .note { border-radius: var(--r-sm); padding: 11px 13px; background: var(--brand-soft); color: var(--brand-strong); font-size: 14px; }
        .note.bad { background: var(--bad-soft); color: var(--bad); }
        .note.ok { background: var(--ok-soft); color: var(--ok); }
        .note.warn { background: var(--warn-soft); color: var(--warn); }
        :root[data-theme="dark"] .note { color: var(--ink); }

        /* ---------- table ---------- */
        .table-wrap { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
        th {
            position: sticky; top: 0;
            background: var(--surface-2);
            color: var(--ink-3);
            font-size: 12px; font-weight: 700;
            white-space: nowrap;
        }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: var(--surface-2); }
        td .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .thumb { width: 64px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
        .thumb-empty { width: 64px; height: 44px; border-radius: 6px; background: var(--surface-2); border: 1px dashed var(--line-strong); }

        /* ---------- empty + skeleton ---------- */
        .empty { text-align: center; padding: 34px 18px; color: var(--ink-3); }
        .empty h3 { color: var(--ink); margin-bottom: 4px; }
        .sk { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; border-radius: 6px; height: 13px; }
        .sk + .sk { margin-top: 9px; }
        .sk.w40 { width: 40%; } .sk.w60 { width: 60%; } .sk.w80 { width: 80%; }
        @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ---------- auth ---------- */
        .auth {
            min-height: 100dvh;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
        }
        .auth-side {
            background: var(--spine);
            color: #eef1f8;
            padding: 48px 44px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .auth-side .verse { font-family: var(--serif); font-size: 26px; line-height: 1.45; max-width: 22ch; }
        .auth-side .ref { color: var(--brass); font-weight: 600; margin-top: 14px; font-size: 14px; }
        .auth-side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; color: var(--spine-ink); font-size: 14px; }
        .auth-side li { display: flex; gap: 9px; align-items: flex-start; }
        .auth-main { display: grid; place-items: center; padding: 32px 24px; }
        .auth-card { width: min(430px, 100%); display: grid; gap: 18px; }

        .wordmark { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
        .wordmark .mark {
            width: 26px; height: 26px; border-radius: 7px;
            background: var(--brand); color: #fff;
            display: grid; place-items: center; font-size: 15px;
            flex: none;
        }

        .tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px; border-radius: 10px; }
        .tabs button {
            flex: 1; border: 0; background: transparent; cursor: pointer;
            padding: 8px 10px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--ink-3);
        }
        .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

        .divider { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 13px; }
        .divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }

        /* ---------- shell ---------- */
        .shell { min-height: 100dvh; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
        .spine {
            background: var(--spine);
            color: var(--spine-ink);
            display: flex; flex-direction: column;
            padding: 18px 12px;
            position: sticky; top: 0; height: 100dvh;
        }
        .spine .wordmark { color: #fff; padding: 4px 8px 18px; }
        .nav { display: grid; gap: 2px; align-content: start; overflow-y: auto; }
        .nav-group { color: #6d7a99; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 16px 10px 6px; }
        .nav button {
            display: flex; align-items: center; gap: 10px;
            width: 100%; text-align: left;
            border: 0; background: transparent; color: var(--spine-ink);
            padding: 9px 10px; border-radius: var(--r-sm);
            cursor: pointer; font-size: 14px; font-weight: 600;
            border-left: 3px solid transparent;
        }
        .nav button:hover { background: var(--spine-hover); color: #fff; }
        .nav button[aria-current="page"] { background: var(--spine-hover); color: #fff; border-left-color: var(--brass); }
        .nav svg { flex: none; opacity: .85; }
        .spine-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid #263049; display: grid; gap: 8px; }
        .spine-foot .who { padding: 4px 8px; color: #fff; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
        .spine-foot .who span { display: block; color: var(--spine-ink); font-weight: 500; font-size: 12px; }
        .spine-foot .btn { background: transparent; border-color: #2c3852; color: #d5dcec; }
        .spine-foot .btn:hover { background: var(--spine-hover); }

        .main { min-width: 0; display: flex; flex-direction: column; }

        .topbar {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 26px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
        }
        .topbar .crumb { font-weight: 700; font-size: 15px; }
        .burger { display: none; }
        .pill {
            display: inline-flex; align-items: center; gap: 7px;
            border: 1px solid var(--line); border-radius: 99px;
            padding: 5px 12px; font-size: 13px; font-weight: 700;
            background: var(--brass-soft); color: var(--brass);
        }
        .icon-btn {
            display: grid; place-items: center;
            width: 38px; height: 38px; border-radius: var(--r-sm);
            border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
        }
        .icon-btn:hover { background: var(--surface-2); color: var(--ink); }

        .content { padding: 26px; max-width: 1280px; }
        .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
        .page-head p { max-width: 68ch; margin: 5px 0 0; color: var(--ink-3); }

        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .toolbar .field { flex: 1 1 180px; }

        /* ---------- metric ---------- */
        .metric .k { color: var(--ink-3); font-size: 13px; font-weight: 600; }
        .metric .v { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .metric .v.brass { color: var(--brass); }
        .metric .sub { color: var(--ink-3); font-size: 12px; margin-top: 4px; }

        .streak-card { background: var(--spine); color: #fff; border-color: transparent; }
        .streak-card .k, .streak-card .sub { color: #93a1c1; }
        .streak-card .v { color: var(--brass); font-size: 46px; }
        .dots { display: flex; gap: 6px; margin-top: 12px; }
        .dots i { width: 22px; height: 6px; border-radius: 99px; background: #2b3550; }
        .dots i.on { background: var(--brass); }

        /* ---------- scripture ---------- */
        .scripture { font-family: var(--serif); font-size: 18px; line-height: 1.72; max-width: 66ch; color: var(--ink); }
        .scripture p { margin: 0 0 12px; }
        .scripture .v-no { color: var(--brass); font-weight: 600; font-size: 13px; font-family: var(--sans); margin-right: 5px; vertical-align: 2px; }
        .scripture mark { background: var(--brass-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
        .chapter-nav { display: flex; gap: 8px; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }

        /* ---------- toast + modal ---------- */
        .toasts {
            position: fixed; z-index: 90;
            top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
            display: grid; gap: 8px; width: min(380px, calc(100vw - 28px));
        }
        .toast {
            background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brand);
            border-radius: var(--r-sm); box-shadow: var(--shadow-2);
            padding: 11px 13px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
        }
        .toast.ok { border-left-color: var(--ok); }
        .toast.bad { border-left-color: var(--bad); }
        .toast.warn { border-left-color: var(--warn); }
        .toast button { border: 0; background: transparent; cursor: pointer; color: var(--ink-3); padding: 0 2px; }
        @media (prefers-reduced-motion: no-preference) {
            .toast { animation: toast-in .18s ease-out; }
            @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
        }

        .overlay {
            position: fixed; inset: 0; z-index: 80;
            background: rgba(12, 16, 28, .5);
            display: grid; place-items: center;
            padding: 18px;
            overflow-y: auto;
        }
        .modal {
            background: var(--surface); border-radius: var(--r-lg);
            box-shadow: var(--shadow-2);
            width: min(720px, 100%);
            max-height: calc(100dvh - 48px);
            display: flex; flex-direction: column;
            margin: auto;
        }
        .modal.narrow { width: min(440px, 100%); }
        .modal header { padding: 20px 22px 12px; }
        .modal header p { margin: 5px 0 0; color: var(--ink-3); font-size: 14px; }
        .modal .body { padding: 6px 22px 18px; overflow-y: auto; display: grid; gap: 14px; }
        .modal footer { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }

        .scrim { position: fixed; inset: 0; background: rgba(12, 16, 28, .5); z-index: 39; }

        /* ---------- responsive ---------- */
        @media (max-width: 1000px) {
            .shell { grid-template-columns: 1fr; }
            .spine {
                position: fixed; z-index: 40; top: 0; bottom: 0; left: 0;
                width: var(--sidebar-w);
                transform: translateX(-100%);
                transition: transform .2s ease;
                padding-top: calc(18px + env(safe-area-inset-top, 0px));
            }
            .shell[data-drawer="open"] .spine { transform: none; }
            .burger { display: grid; }
            .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .auth { grid-template-columns: 1fr; }
            .auth-side { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
        @media (max-width: 640px) {
            .content { padding: 18px; }
            .topbar { padding: 10px 16px; }
            .g2, .g3, .g4 { grid-template-columns: 1fr; }
            .page-head { flex-direction: column; }
            h1 { font-size: 22px; }
            .modal footer { flex-direction: column-reverse; }
            .modal footer .btn { width: 100%; }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div id="layer"></div>
    <script>
        "use strict";

        /* =======================================================================
         * 1. Konfigurasi
         * ===================================================================== */
        const CONFIG = {
            API_URL: "http://localhost:3000/api",
            GOOGLE_CLIENT_ID: "19085886514-lgfr9ce97us82dvoa7qdfp4go6ejlavt.apps.googleusercontent.com",
            PAGE_SIZE: 50
        };
        const API_ORIGIN = CONFIG.API_URL.replace(/\/api\/?$/, "");
        const STORAGE = { token: "jwt_token", user: "auth_user", theme: "christapi_theme" };

        /* =======================================================================
         * 2. Utilitas
         * ===================================================================== */
        const $ = (sel, scope) => (scope || document).querySelector(sel);
        const $$ = (sel, scope) => Array.from((scope || document).querySelectorAll(sel));

        /** Escape untuk teks maupun atribut HTML. */
        function h(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }
        /** Ambil nilai pertama yang ada (API mencampur camelCase & PascalCase). */
        function pick(obj, ...keys) {
            for (const key of keys) if (obj && obj[key] !== undefined && obj[key] !== null) return obj[key];
            return undefined;
        }
        const num = (value, fallback = 0) => (Number.isFinite(Number(value)) ? Number(value) : fallback);

        function store(key, value) {
            try {
                if (value === undefined) return localStorage.getItem(key);
                if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
            } catch (_) { /* storage bisa diblokir; abaikan */ }
            return null;
        }

        function fmtDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
        }
        function fmtDateTime(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }
        const todayISO = () => new Date().toISOString().slice(0, 10);
        function slugify(text) {
            return String(text || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80);
        }
        function mediaURL(path) {
            if (!path) return "";
            return /^https?:\/\//i.test(path) ? path : API_ORIGIN + (path.startsWith("/") ? "" : "/") + path;
        }
        function debounce(fn, wait = 350) {
            let timer;
            return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), wait); };
        }
        function val(id) { const el = document.getElementById(id); return el ? String(el.value ?? "").trim() : ""; }

        /* =======================================================================

        class ApiError extends Error {
            constructor(status, message) { super(message); this.name = "ApiError"; this.status = status; }
        }
        function readErrorMessage(payload, status) {
            if (typeof payload?.message === "string" && payload.message) return payload.message;
            const errors = payload?.errors;
            if (typeof errors === "string") return errors;
            if (errors && typeof errors === "object") {
                const parts = Object.values(errors).map(v => (Array.isArray(v) ? v.join(", ") : String(v))).filter(Boolean);
                if (parts.length) return parts.join(" · ");
            }
            if (status === 403) return "Anda tidak punya akses untuk tindakan ini.";
            if (status === 404) return "Data tidak ditemukan.";
            if (status === 409) return "Data sudah ada.";
            if (status >= 500) return "Server sedang bermasalah. Coba lagi sebentar lagi.";
            return "Permintaan gagal (" + status + ").";
        }

        async function api(path, options = {}) {
            const headers = { Accept: "application/json", ...(options.headers || {}) };
            const isForm = options.body instanceof FormData;
            if (options.body !== undefined && !isForm) headers["Content-Type"] = "application/json";
            if (state.token) headers.Authorization = "Bearer " + state.token;

            let response;
            try {
                response = await fetch(CONFIG.API_URL + path, { ...options, headers });
            } catch (_) {
                throw new ApiError(0, "Tidak bisa menghubungi server di " + API_ORIGIN + ". Periksa koneksi atau jalankan API-nya.");
            }
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                if (response.status === 401 && state.token) {
                    clearSession();
                    renderAuth();
                    toast("Sesi Anda berakhir. Masuk lagi untuk melanjutkan.", "warn");
                }
                throw new ApiError(response.status, readErrorMessage(payload, response.status));
            }
            return payload;
        }
        const listOf = payload => (Array.isArray(payload?.data) ? payload.data : Array.isArray(payload) ? payload : []);
        const dataOf = payload => (payload && typeof payload.data === "object" && payload.data !== null ? payload.data : {});

        async function uploadImage(path, file) {
            const form = new FormData();
            form.append("image", file);

        function toast(message, type = "ok", timeout = 5200) {
            const host = $("#toasts");
            if (!host) return;
            const el = document.createElement("div");
            el.className = "toast " + (type === "error" ? "bad" : type);
            el.innerHTML = '<div style="flex:1">' + h(message) + '</div><button type="button" aria-label="Tutup">' + icon("x", 14) + "</button>";
            el.querySelector("button").onclick = () => el.remove();
            host.appendChild(el);
            while (host.children.length > 4) host.firstElementChild.remove();
            if (timeout) setTimeout(() => el.remove(), timeout);
        }
        const toastError = error => toast(error instanceof Error ? error.message : String(error), "bad", 7000);

        /** Modal generik. Mengembalikan { el, close }. */
        function openModal({ title, subtitle = "", body = "", footer = "", narrow = false, onClose }) {
            const layer = $("#layer");
            const overlay = document.createElement("div");
            overlay.className = "overlay";
            overlay.innerHTML =
                '<div class="modal' + (narrow ? " narrow" : "") + '" role="dialog" aria-modal="true" aria-label="' + h(title) + '">' +
                '<header><h2>' + h(title) + "</h2>" + (subtitle ? "<p>" + h(subtitle) + "</p>" : "") + "</header>" +
                '<div class="body">' + body + "</div>" +
                '<footer>' + footer + "</footer></div>";
            layer.appendChild(overlay);

            const previous = document.activeElement;
            const close = () => {
                if (!overlay.isConnected) return;
                overlay.remove();
                document.removeEventListener("keydown", onKey);
                if (previous?.focus) previous.focus();
                onClose?.();
            };
            const onKey = event => {
                if (event.key === "Escape") { event.stopPropagation(); close(); return; }
                if (event.key !== "Tab") return;
                const focusables = $$('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])', overlay);
                if (!focusables.length) return;
                const first = focusables[0], last = focusables[focusables.length - 1];
                if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
                else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
            };
            overlay.addEventListener("mousedown", event => { if (event.target === overlay) close(); });
            document.addEventListener("keydown", onKey);
            setTimeout(() => {
                const target = $("input, select, textarea, button", overlay);
                target?.focus();
            }, 20);
            return { el: overlay, close };
        }

        /** Pengganti confirm() bawaan. */
        function askConfirm({ title, message, confirmText = "Lanjutkan", danger = false }) {
            return new Promise(resolve => {
                let answered = false;
                const modal = openModal({
                    title, narrow: true,
                    body: '<p class="muted" style="margin:0">' + h(message) + "</p>",
                    footer: '<button type="button" class="btn ghost" data-close>Batal</button>' +
                        '<button type="button" class="btn ' + (danger ? "danger" : "") + '" data-ok>' + h(confirmText) + "</button>",
                    onClose: () => { if (!answered) resolve(false); }
                });
                $("[data-close]", modal.el).onclick = () => modal.close();
                $("[data-ok]", modal.el).onclick = () => { answered = true; modal.close(); resolve(true); };
            });
        }

        /** Pengganti prompt() bawaan; mengembalikan string atau null jika dibatalkan. */
        function askInput({ title, message = "", label, value = "", placeholder = "", required = false, multiline = false, confirmText = "Simpan" }) {
            return new Promise(resolve => {
                let answered = false;
                const control = multiline
                    ? '<textarea id="ask-input" placeholder="' + h(placeholder) + '">' + h(value) + "</textarea>"
                    : '<input id="ask-input" value="' + h(value) + '" placeholder="' + h(placeholder) + '">';
                const modal = openModal({
                    title, subtitle: message, narrow: true,
                    body: '<div class="field"><label for="ask-input">' + h(label) + "</label>" + control + '<div class="err hidden" data-err></div></div>',
                    footer: '<button type="button" class="btn ghost" data-close>Batal</button>' +
                        '<button type="button" class="btn" data-ok>' + h(confirmText) + "</button>",
                    onClose: () => { if (!answered) resolve(null); }
                });
                const input = $("#ask-input", modal.el);
                const error = $("[data-err]", modal.el);
                const submit = () => {
                    const text = String(input.value || "").trim();
                    if (required && !text) {
                        error.textContent = "Bagian ini wajib diisi.";
                        error.classList.remove("hidden");
                        input.focus();
                        return;
                    }
                    answered = true; modal.close(); resolve(text);
                };
                $("[data-close]", modal.el).onclick = () => modal.close();
                $("[data-ok]", modal.el).onclick = submit;
                input.addEventListener("keydown", event => { if (event.key === "Enter" && !multiline) submit(); });
            });
        }

                active: "Aktif", inactive: "Nonaktif", scheduled: "Terjadwal"

            return '<span class="badge ' + tone + '">' + h(labels[key] || status || "-") + "</span>";

        function thumb(url, alt = "") {

        }
        function field({ id, label, type = "text", value = "", placeholder = "", hint = "", options, rows, attrs = "" }) {
            let control;
            if (options) {
                control = '<select id="' + id + '" ' + attrs + ">" + options + "</select>";
            } else if (type === "textarea") {
                control = '<textarea id="' + id + '" placeholder="' + h(placeholder) + '"' + (rows ? ' rows="' + rows + '"' : "") + " " + attrs + ">" + h(value) + "</textarea>";
            } else if (type === "checkbox") {
                control = '<label class="check"><input id="' + id + '" type="checkbox" ' + (value ? "checked" : "") + " " + attrs + "> " + h(placeholder || label) + "</label>";
                return '<div class="field" style="align-content:end">' + control + (hint ? '<div class="hint">' + h(hint) + "</div>" : "") + "</div>";
            } else {
                control = '<input id="' + id + '" type="' + type + '" value="' + h(value) + '" placeholder="' + h(placeholder) + '" ' + attrs + ">";
            }
            return '<div class="field"><label for="' + id + '">' + h(label) + "</label>" + control +
                (hint ? '<div class="hint">' + h(hint) + "</div>" : "") + "</div>";
        }
        function optionList(items, selected, { value = "code", text = "name" } = {}) {

                return '<option value="' + h(optionValue) + '"' + (String(selected ?? "") === optionValue ? " selected" : "") + ">" +

        /** Tombol yang otomatis menampilkan status memuat saat aksi async berjalan. */
        async function withBusy(button, task) {
            if (!button) return task();

            button.disabled = true;
            button.setAttribute("aria-busy", "true");
            button.innerHTML = '<span class="spin"></span> ' + (button.dataset.busyLabel || "Memproses...");
            try { return await task(); }

                button.removeAttribute("aria-busy");

                try {
                    await api("/verify-otp", { method: "POST", body: JSON.stringify({ email, otp_code: code }) });

        /* ---------- Google ---------- */
        let googleRetry = 0;
        function mountGoogleButton(containerID) {
            const container = document.getElementById(containerID);
            if (!container) return;
            if (window.google?.accounts?.id) {
                googleRetry = 0;
                try {
                    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onGoogleCredential });
                    google.accounts.id.renderButton(container, { theme: document.documentElement.dataset.theme === "dark" ? "filled_black" : "outline", size: "large", width: 340 });
                } catch (_) {
                    container.innerHTML = '<p class="small muted">Masuk dengan Google sedang tidak tersedia.</p>';
                }
                return;
            }
            if (googleRetry++ > 20) {
                container.innerHTML = '<p class="small muted">Masuk dengan Google tidak bisa dimuat. Gunakan email dan password.</p>';
                return;
            }
            setTimeout(() => mountGoogleButton(containerID), 300);
        }
        function onGoogleCredential(response) {
            if (response?.credential) submitGoogleLogin(response.credential);
        }
        async function submitGoogleLogin(idToken) {
            try {
                const result = dataOf(await api("/auth/google", { method: "POST", body: JSON.stringify({ id_token: idToken }) }));
                if (result.token) {
                    setSession(result.token, result.user);
                    renderApp();
                    return toast("Berhasil masuk dengan Google.");
                }
                if (result.status === "pending_username") return openGoogleProfile(idToken);
                toast("Akun Google Anda menunggu persetujuan admin.", "warn");
            } catch (error) { toastError(error); }
        }
        function openGoogleProfile(idToken) {
            const modal = openModal({
                title: "Lengkapi profil Anda",
                subtitle: "Data ini dipakai admin untuk memverifikasi keanggotaan.",
                narrow: true,
                body: field({ id: "g-username", label: "Username", placeholder: "misal: yohanes.s" }) +
                    field({ id: "g-name", label: "Nama lengkap" }) +
                    field({ id: "g-phone", label: "Nomor telepon", type: "tel", placeholder: "Opsional" }) +
                    field({ id: "g-address", label: "Alamat", type: "textarea", placeholder: "Opsional" }),
                footer: '<button class="btn ghost" type="button" data-close>Batal</button><button class="btn" type="button" data-save>Kirim profil</button>'
            });
            $("[data-close]", modal.el).onclick = () => modal.close();
            $("[data-save]", modal.el).onclick = event => withBusy(event.currentTarget, async () => {
                if (!val("g-username") || !val("g-name")) return toast("Username dan nama lengkap wajib diisi.", "warn");
                try {

        const routeOf = name => (ROUTES[name] && (!ROUTES[name].admin || isAdmin()) ? name : "dashboard");

        function renderApp() {
            if (!state.token || !state.user) return renderAuth();
            $("#layer").innerHTML = "";
            const groups = [];
            Object.entries(ROUTES).forEach(([name, route]) => {
                if (route.admin && !isAdmin()) return;
                let group = groups.find(item => item.name === route.group);
                if (!group) groups.push(group = { name: route.group, items: [] });
                group.items.push({ name, route });
            });

        ACTIONS.go = ({ page }) => navigate(page);
        ACTIONS.drawer = () => {
            const shell = $("#shell");
            const open = shell.dataset.drawer !== "open";
            shell.dataset.drawer = open ? "open" : "closed";
            $("#scrim")?.remove();
            if (open) {
                const scrim = document.createElement("div");
                scrim.className = "scrim";
                scrim.id = "scrim";
                scrim.onclick = () => ACTIONS.drawer();
                $("#layer").appendChild(scrim);
            }
        };
        ACTIONS.logout = async () => {
            try { await api("/logout", { method: "POST" }); } catch (_) { /* tetap keluar walau server gagal */ }
            clearSession();
            location.hash = "";
            renderAuth();
            toast("Anda sudah keluar.");
        };

        function navigate(page) {
            const name = routeOf(page);
            const target = "#/" + name;
            if (location.hash !== target) { location.hash = target; return; }
            renderRoute(name);
        }

        function renderRoute(name) {
            const route = ROUTES[name];
            state.page = name;
            state.seq += 1;
            const seq = state.seq;

            $$(".nav [data-act='go']").forEach(button => {
                if (button.dataset.page === name) button.setAttribute("aria-current", "page");
                else button.removeAttribute("aria-current");
            });
            const crumb = $("#crumb");
            if (crumb) crumb.textContent = route.label;
            if ($("#shell")?.dataset.drawer === "open") ACTIONS.drawer();

            const host = $("#page");
            if (!host) return;
            host.innerHTML = pageHead(route.title, route.subtitle) + skeleton(4);
            window.scrollTo({ top: 0 });
            Promise.resolve(route.render(seq)).catch(error => {
                if (seq === state.seq) {
                    toastError(error);
                    paint(seq, pageHead(route.title, route.subtitle) +
                        '<div class="card">' + emptyState("Halaman gagal dimuat", error.message) + "</div>");
                }
            });
        }

        window.addEventListener("hashchange", () => {
            if (!state.token || !$("#page")) return;
            navigate(location.hash.replace(/^#\/?/, "") || "dashboard");
        });

        /** Render hanya jika pengguna belum pindah halaman. */
        function paint(seq, html, target = "#page") {
            if (seq !== state.seq) return false;
            const host = $(target);
            if (!host) return false;
            host.innerHTML = html;
            return true;
        }
        function head(route) { return pageHead(route.title, route.subtitle, route.actions || ""); }

        async function refreshPoints() {
            if (!state.user?.id) return;
            try {
                const points = dataOf(await api("/points?userId=" + encodeURIComponent(state.user.id)));
                const balance = num(pick(points, "Balance", "balance"), num(state.user.points));
                updateUser({ points: balance });
            } catch (_) { /* pill point tidak kritis */ }
        }

        async function pageDashboard(seq) {
            const [pointsRes, streakRes, activityRes, attendanceRes] = await Promise.allSettled([
                api("/points?userId=" + encodeURIComponent(state.user.id) + "&limit=5"),
                api("/streaks"),
                api("/activities?status=published&limit=5"),
                api("/attendance/summary")
            ]);
            if (seq !== state.seq) return;

            const points = pointsRes.status === "fulfilled" ? dataOf(pointsRes.value) : {};
            const streaks = streakRes.status === "fulfilled" ? listOf(streakRes.value) : [];
            const activities = activityRes.status === "fulfilled" ? listOf(activityRes.value) : [];
            const attendance = attendanceRes.status === "fulfilled" ? dataOf(attendanceRes.value) : {};

            const balance = num(pick(points, "Balance", "balance"), num(state.user.points));
            updateUser({ points: balance });
            const streak = streaks.find(item => item.streak_type === "daily_activity") || streaks[0] || null;
            const current = num(streak?.current_streak);
            const best = num(streak?.longest_streak);
            const failed = [pointsRes, streakRes, activityRes, attendanceRes].some(r => r.status === "rejected");

            paint(seq, head(ROUTES.dashboard) +
                (failed ? '<div class="note warn" style="margin-bottom:16px">Sebagian data gagal dimuat. Muat ulang halaman untuk mencoba lagi.</div>' : "") +
                '<div class="grid g4">' +
                '<div class="card metric streak-card" style="grid-row:span 2">' +
                '<div class="k">' + icon("flame", 14) + " Streak harian</div>" +
                '<div class="v">' + current + "</div>" +
                '<div class="sub">hari berturut-turut · rekor ' + best + " hari</div>" +
                '<div class="dots" aria-hidden="true">' + Array.from({ length: 7 }, (_, i) => '<i class="' + (i < Math.min(current, 7) ? "on" : "") + '"></i>').join("") + "</div>" +
                '<p class="sub" style="margin-top:14px">Satu check-in kegiatan per hari sudah menjaga streak, dari kategori mana pun.</p>' +
                "</div>" +
                '<div class="card metric"><div class="k">Saldo point</div><div class="v brass">' + balance + '</div><div class="sub">siap ditukar di halaman Reward</div></div>' +
                '<div class="card metric"><div class="k">Kehadiran tercatat</div><div class="v">' + num(attendance.present) + '</div><div class="sub">' + num(attendance.late) + " terlambat · " + num(attendance.excused) + " izin</div></div>" +
                '<div class="card metric"><div class="k">Kegiatan terbuka</div><div class="v">' + activities.length + '</div><div class="sub">status terbit</div></div>' +
                '<div class="card metric"><div class="k">Status akun</div><div class="v" style="font-size:22px">' + (state.user.is_active === false ? "Menunggu" : "Aktif") + "</div>" +
                '<div class="sub">' + h(state.user.role || "Anggota") + "</div></div>" +
                "</div>" +
                '<div class="grid g2" style="margin-top:16px">' +
                '<div class="card"><div class="card-head"><h2>Kegiatan terdekat</h2>' +
                '<button class="btn quiet" type="button" data-act="go" data-page="activities">Lihat semua</button></div>' +
                (activities.length ? activities.map(item =>
                    '<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)">' +
                    thumb(item.image_url, item.title) +
                    '<div style="min-width:0;flex:1"><strong>' + h(item.title) + "</strong>" +
                    '<div class="small muted">' + h(item.category_name || "Tanpa kategori") + " · " +
                    (item.occurrence?.starts_at ? fmtDateTime(item.occurrence.starts_at) : item.schedule?.frequency ? "rutin " + h(item.schedule.frequency) : "jadwal menyusul") + "</div></div>" +
                    '<button class="btn sm" type="button" data-act="checkin" data-uuid="' + h(item.uuid) + '">Absen</button></div>'
                ).join("") : emptyState("Belum ada kegiatan", "Kegiatan yang sudah diterbitkan admin akan muncul di sini.")) +
                "</div>" +
                '<div class="card"><h2>Cara mengumpulkan point</h2>' +
                '<p class="muted small">Tiga jalur yang paling cepat menaikkan saldo Anda.</p>' +
                '<div class="stack" style="gap:10px;margin-top:6px">' +
                ["Absen kegiatan yang sedang berlangsung.", "Selesaikan bacaan Alkitab dan kirim kesimpulannya.", "Jaga streak agar bonus harian tetap berjalan."]
                    .map(text => '<div class="row" style="gap:10px;align-items:flex-start">' + '<span class="badge brand">' + icon("check", 13) + "</span><span>" + h(text) + "</span></div>").join("") +

        /* =======================================================================

        const bible = { version: "tb", testament: "", book: "", chapter: 1, books: [] };

        async function pageBible(seq) {
            let versions = [];
            try { versions = listOf(await api("/bible/versions")); } catch (error) { toastError(error); }
            if (seq !== state.seq) return;
            if (!versions.length) versions = [{ code: "tb", name: "Terjemahan Baru" }];
            if (!versions.some(item => item.code === bible.version)) bible.version = versions[0].code;

            paint(seq, head(ROUTES.bible) +
                '<div class="card"><div class="toolbar">' +
                field({ id: "bible-version", label: "Versi", options: optionList(versions, bible.version) }) +
                field({ id: "bible-testament", label: "Perjanjian", options: '<option value="">Semua</option><option value="PL">Perjanjian Lama</option><option value="PB">Perjanjian Baru</option>' }) +
                field({ id: "bible-book", label: "Kitab", options: '<option value="">Memuat...</option>' }) +
                field({ id: "bible-chapter", label: "Pasal", type: "number", value: bible.chapter, attrs: "min=1" }) +
                '<button class="btn" type="button" data-act="bible-read">Baca pasal</button>' +
                "</div>" +
                '<div class="toolbar" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' +
                field({ id: "bible-query", label: "Cari kata dalam ayat", placeholder: 'misal: kasih karunia' }) +
                field({ id: "bible-scope", label: "Batasi kitab", options: '<option value="">Semua kitab</option>' }) +
                '<button class="btn ghost" type="button" data-act="bible-search">' + icon("search", 15) + " Cari</button>" +
                "</div></div>" +
                '<div id="bible-view" style="margin-top:16px"></div>');
            if (seq !== state.seq) return;

            $("#bible-version").onchange = () => { bible.version = val("bible-version"); loadBibleBooks(); };
            $("#bible-testament").onchange = () => { bible.testament = val("bible-testament"); loadBibleBooks(); };
            $("#bible-query").addEventListener("keydown", event => { if (event.key === "Enter") ACTIONS["bible-search"](); });
            await loadBibleBooks();
            $("#bible-view").innerHTML = '<div class="card">' + emptyState("Pilih kitab dan pasal", "Hasil bacaan akan tampil di sini, lengkap dengan nomor ayat.") + "</div>";
        }

        async function loadBibleBooks() {
            try {
                const query = "?version=" + encodeURIComponent(bible.version) + (bible.testament ? "&testament=" + encodeURIComponent(bible.testament) : "");
                bible.books = listOf(await api("/bible/books" + query));
                const options = optionList(bible.books, bible.book);
                const bookSelect = $("#bible-book"), scopeSelect = $("#bible-scope");
                if (!bookSelect) return;
                bookSelect.innerHTML = options || '<option value="">Tidak ada kitab</option>';
                scopeSelect.innerHTML = '<option value="">Semua kitab</option>' + options;
                bible.book = bookSelect.value;
            } catch (error) { toastError(error); }
        }

        ACTIONS["bible-read"] = () => readChapter(val("bible-book"), num(val("bible-chapter"), 1));
        ACTIONS["bible-step"] = ({ book, chapter }) => {
            const select = $("#bible-book"); if (select) select.value = book;
            const input = $("#bible-chapter"); if (input) input.value = chapter;
            readChapter(book, num(chapter, 1));
        };

        async function readChapter(book, chapter) {
            if (!book || !Number.isInteger(chapter) || chapter < 1) return toast("Pilih kitab dan nomor pasal yang benar.", "warn");
            bible.book = book; bible.chapter = chapter;
            const view = $("#bible-view");
            view.innerHTML = skeleton(5);
            try {
                const result = dataOf(await api("/bible/" + encodeURIComponent(bible.version) + "/" + encodeURIComponent(book) + "/" + chapter));
                const verses = Array.isArray(result.verses) ? result.verses : [];
                const index = bible.books.findIndex(item => item.code === book);
                const previous = chapter > 1 ? { book, chapter: chapter - 1 } : index > 0 ? { book: bible.books[index - 1].code, chapter: 1 } : null;
                view.innerHTML = '<article class="card">' +
                    '<div class="card-head"><div><h2>' + h(result.book?.name || book) + " " + h(result.chapter || chapter) + "</h2>" +
                    '<p class="muted small" style="margin:4px 0 0">' + h(result.version?.name || bible.version.toUpperCase()) +
                    (result.book?.testament ? " · " + h(result.book.testament === "PL" ? "Perjanjian Lama" : "Perjanjian Baru") : "") + "</p></div></div>" +
                    '<div class="scripture">' + (verses.length
                        ? verses.map(verse => '<p><span class="v-no">' + h(verse.verse) + "</span>" + h(verse.text) + "</p>").join("")
                        : '<p class="muted">Pasal ini belum memiliki ayat.</p>') + "</div>" +
                    '<div class="chapter-nav">' +
                    (previous ? '<button class="btn ghost sm" type="button" data-act="bible-step" data-book="' + h(previous.book) + '" data-chapter="' + previous.chapter + '">' + icon("left", 15) + " Pasal sebelumnya</button>" : "") +
                    '<button class="btn ghost sm" type="button" data-act="bible-step" data-book="' + h(book) + '" data-chapter="' + (chapter + 1) + '">Pasal berikutnya ' + icon("right", 15) + "</button>" +
                    "</div></article>";
            } catch (error) {
                view.innerHTML = '<div class="card">' + emptyState("Pasal tidak bisa dibuka", error.message) + "</div>";
            }
        }

        ACTIONS["bible-search"] = async () => {
            const query = val("bible-query");
            if (!query) return toast("Ketik kata yang ingin dicari.", "warn");
            const view = $("#bible-view");
            view.innerHTML = skeleton(4);
            try {
                const params = new URLSearchParams({ q: query });
                if (bible.testament) params.set("testament", bible.testament);
                if (val("bible-scope")) params.set("book", val("bible-scope"));
                const items = listOf(await api("/bible/" + encodeURIComponent(bible.version) + "/search?" + params.toString()));
                const pattern = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
                view.innerHTML = '<div class="card"><div class="card-head"><h2>Hasil pencarian</h2>' +
                    '<span class="badge">' + items.length + " ayat untuk “" + h(query) + "”</span></div>" +
                    (items.length ? '<div class="scripture">' + items.map(item =>
                        '<p><span class="v-no">' + h(item.book?.name || item.book_code || "") + " " + h(item.chapter) + ":" + h(item.verse) + "</span>" +
                        h(item.text).replace(pattern, "<mark>$1</mark>") + "</p>").join("") + "</div>"
                        : emptyState("Tidak ada ayat yang cocok", "Coba kata lain atau lepas filter kitab.")) + "</div>";
            } catch (error) {
                view.innerHTML = '<div class="card">' + emptyState("Pencarian gagal", error.message) + "</div>";
            }
        };

        const activityFilter = { search: "", type: "", status: "" };

                "</div></div>" +
                '<div id="activity-list" style="margin-top:16px"></div>');
            if (seq !== state.seq) return;
            $("#act-type").value = activityFilter.type;
            if ($("#act-status")) $("#act-status").value = activityFilter.status;
            $("#act-search").addEventListener("input", debounce(() => ACTIONS["activity-refresh"]()));
            $("#act-type").onchange = () => ACTIONS["activity-refresh"]();
            if ($("#act-status")) $("#act-status").onchange = () => ACTIONS["activity-refresh"]();
            await loadActivities();
        }

        ACTIONS["activity-refresh"] = () => loadActivities();

        async function loadActivities() {
            const host = $("#activity-list");
            if (!host) return;
            activityFilter.search = val("act-search");
            activityFilter.type = val("act-type");
            activityFilter.status = isAdmin() ? val("act-status") : "published";
            host.innerHTML = skeleton(4);
            const params = new URLSearchParams({ limit: String(CONFIG.PAGE_SIZE) });
            if (activityFilter.status) params.set("status", activityFilter.status);
            if (activityFilter.search) params.set("search", activityFilter.search);
            if (activityFilter.type) params.set("activity_type", activityFilter.type);
            try {
                const items = listOf(await api("/activities?" + params.toString()));
                items.forEach(item => state.cache.set(item.uuid, item));
                host.innerHTML = '<div class="table-wrap"><table><thead><tr>' +
                    "<th>Kegiatan</th><th>Kategori</th><th>Jadwal</th><th>Status</th><th>Streak</th><th>Tindakan</th>" +
                    "</tr></thead><tbody>" +
                    (items.length ? items.map(activityRow).join("") : emptyRow(6, "Belum ada kegiatan yang cocok dengan filter ini.")) +
                    "</tbody></table></div>";
            } catch (error) {
                host.innerHTML = '<div class="card">' + emptyState("Daftar kegiatan gagal dimuat", error.message,
                    '<button class="btn ghost" type="button" data-act="activity-refresh" style="margin-top:10px">Coba lagi</button>') + "</div>";
            }
        }

        function activityRow(item) {
            const schedule = item.schedule
                ? "Rutin " + h(item.schedule.frequency || "") + (item.schedule.start_time ? " · " + h(item.schedule.start_time) : "")
                : item.occurrence?.starts_at ? fmtDateTime(item.occurrence.starts_at) : "Jadwal menyusul";
            const place = item.occurrence?.location ? '<div class="small muted">' + h(item.occurrence.location) + "</div>" : "";
            const uuid = h(item.uuid);
            return "<tr>" +
                '<td><div style="display:flex;gap:10px;align-items:center;min-width:240px">' + thumb(item.image_url, item.title) +
                '<div style="white-space:normal"><strong>' + h(item.title) + "</strong>" +
                (item.description ? '<div class="small muted">' + h(String(item.description).slice(0, 90)) + "</div>" : "") +
                (item.bible_config ? '<span class="badge brand" style="margin-top:4px">' + icon("book", 12) + " Bacaan Alkitab</span>" : "") +
                "</div></div></td>" +
                "<td>" + h(item.category_name || "-") + "</td>" +
                "<td>" + schedule + place + "</td>" +
                "<td>" + statusBadge(item.status) + "</td>" +
                "<td>" + (item.streak_enabled ? '<span class="badge brass">' + icon("flame", 12) + " +" + num(item.streak_points) + "</span>" : '<span class="muted">-</span>') + "</td>" +
                '<td><div class="actions">' +
                '<button class="btn sm" type="button" data-act="checkin" data-uuid="' + uuid + '" data-busy-label="Mengabsen...">Absen</button>' +
                (item.bible_config ? '<button class="btn ghost sm" type="button" data-act="bible-task" data-uuid="' + uuid + '">Baca</button>' : "") +
                (isAdmin() ? '<button class="btn ghost sm" type="button" data-act="activity-edit" data-uuid="' + uuid + '" aria-label="Ubah kegiatan">' + icon("edit", 15) + "</button>" +
                    '<button class="btn ghost sm" type="button" data-act="activity-delete" data-uuid="' + uuid + '" aria-label="Hapus kegiatan">' + icon("trash", 15) + "</button>" : "") +
                "</div></td></tr>";
        }

        /* ---------- absensi + streak ---------- */
        ACTIONS.checkin = async ({ uuid }, button) => {
            const item = state.cache.get(uuid);
            if (!item) return toast("Data kegiatan sudah berubah. Muat ulang daftarnya.", "warn");
            await withBusy(button, async () => {
                const messages = [];
                let earned = 0;
                try {
                    const attendance = await api("/attendance/check-in", {
                        method: "POST",
                        body: JSON.stringify({ activity_id: item.id, site_id: item.site_id ?? null, notes: null })
                    });
                    earned += num(dataOf(attendance).points_earned);
                    messages.push("Kehadiran tercatat");
                } catch (error) {
                    if (error.status !== 409) return toastError(error);
                    messages.push("Kehadiran hari ini sudah tercatat");
                }
                if (item.streak_enabled) {
                    try {
                        const streak = dataOf(await api("/streaks/check-in", { method: "POST", body: JSON.stringify({ activity_uuid: item.uuid }) }));
                        earned += num(streak.points_earned);
                        messages.push("streak " + num(streak.current_streak) + " hari");
                    } catch (error) {
                        if (error.status !== 409) messages.push("streak gagal diperbarui");
                    }
                }
                toast(messages.join(" · ") + (earned ? " · +" + earned + " point" : ""));
                refreshPoints();
            });
        };

        /* ---------- form kegiatan ---------- */
        ACTIONS["activity-new"] = () => openActivityForm(null);
        ACTIONS["activity-edit"] = ({ uuid }) => openActivityForm(state.cache.get(uuid) || null);
        ACTIONS["activity-delete"] = async ({ uuid }) => {
            const item = state.cache.get(uuid);
            const ok = await askConfirm({
                title: "Hapus kegiatan ini?",
                message: "“" + (item?.title || uuid) + "” akan hilang dari daftar jemaat. Riwayat absensi yang sudah ada tetap tersimpan.",
                confirmText: "Hapus kegiatan", danger: true
            });
            if (!ok) return;
            try {
                await api("/admin/activities/" + encodeURIComponent(uuid), { method: "DELETE" });
                toast("Kegiatan dihapus.");
                loadActivities();
            } catch (error) { toastError(error); }
        };

        function localInputValue(value) {
            const date = value ? new Date(value) : null;
            if (!date || Number.isNaN(date.getTime())) return "";
            const pad = n => String(n).padStart(2, "0");
            return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
        }

        async function openActivityForm(item) {
            const editing = Boolean(item?.uuid);
            const config = item?.bible_config || null;
            const modal = openModal({
                title: editing ? "Ubah kegiatan" : "Buat kegiatan",
                subtitle: "Site mengikuti akun pembuat. Streak memakai jenis daily_activity untuk semua kategori.",
                body: '<div class="grid g2">' +
                    field({ id: "af-title", label: "Judul", value: item?.title || "", placeholder: "Ibadah Minggu" }) +

                    field({ id: "af-type", label: "Tipe", options: '<option value="one_time">Sekali jalan</option><option value="recurring">Rutin</option>' }) +
                    field({ id: "af-status", label: "Status", options: '<option value="draft">Draf</option><option value="published">Terbit</option><option value="cancelled">Dibatalkan</option><option value="completed">Selesai</option>' }) +
                    '<div style="grid-column:1/-1">' + field({ id: "af-description", label: "Deskripsi", type: "textarea", value: item?.description || "", placeholder: "Keterangan singkat untuk jemaat" }) + "</div>" +
                    field({ id: "af-streak-points", label: "Point streak", type: "number", value: item?.streak_points ?? 5, attrs: "min=0" }) +
                    field({ id: "af-image", label: "Foto kegiatan", type: "file", attrs: 'accept="image/jpeg,image/png,image/webp"' }) +
                    "</div>" +
                    '<div id="af-once" class="grid g2">' +
                    field({ id: "af-starts", label: "Waktu mulai", type: "datetime-local", value: localInputValue(item?.occurrence?.starts_at) }) +
                    field({ id: "af-location", label: "Lokasi", value: item?.occurrence?.location || "", placeholder: "Gedung gereja" }) +
                    "</div>" +
                    '<div id="af-repeat" class="grid g3">' +
                    field({ id: "af-frequency", label: "Frekuensi", options: '<option value="daily">Harian</option><option value="weekly">Mingguan</option><option value="monthly">Bulanan</option>' }) +
                    field({ id: "af-interval", label: "Setiap", type: "number", value: item?.schedule?.interval_value ?? 1, attrs: "min=1", hint: "1 = setiap periode" }) +
                    field({ id: "af-days", label: "Hari", value: (item?.schedule?.days_of_week || [0]).join(","), hint: "0 Minggu, 1 Senin, dst." }) +
                    field({ id: "af-start-date", label: "Mulai tanggal", type: "date", value: item?.schedule?.start_date || todayISO() }) +
                    field({ id: "af-start-time", label: "Jam mulai", type: "time", value: item?.schedule?.start_time || "09:00" }) +
                    field({ id: "af-end-time", label: "Jam selesai", type: "time", value: item?.schedule?.end_time || "11:00" }) +
                    "</div>" +
                    '<div style="border-top:1px solid var(--line);padding-top:14px">' +
                    "<h3>Bacaan Alkitab</h3><p class=\"muted small\" style=\"margin:4px 0 0\">Isi bagian ini bila jemaat perlu membaca perikop tertentu di dalam kegiatan.</p></div>" +
                    '<div class="grid g2">' +
                    field({ id: "af-bible-mode", label: "Mode", options: '<option value="none">Tanpa bacaan</option><option value="reading">Baca saja</option><option value="reflection">Baca dan kirim kesimpulan</option>' }) +
                    field({ id: "af-bible-version", label: "Versi", options: '<option value="">Memuat...</option>' }) +
                    "</div>" +
                    '<div id="af-bible" class="grid g3">' +
                    '<div style="grid-column:1/-1">' + field({ id: "af-bible-book", label: "Kitab", options: '<option value="">Memuat...</option>' }) + "</div>" +
                    field({ id: "af-bible-sc", label: "Pasal awal", type: "number", value: config?.start_chapter ?? 1, attrs: "min=1" }) +
                    field({ id: "af-bible-sv", label: "Ayat awal", type: "number", value: config?.start_verse ?? 1, attrs: "min=1" }) +
                    field({ id: "af-bible-ec", label: "Pasal akhir", type: "number", value: config?.end_chapter ?? config?.start_chapter ?? 1, attrs: "min=1" }) +
                    field({ id: "af-bible-ev", label: "Ayat akhir", type: "number", value: config?.end_verse ?? 1, attrs: "min=1" }) +
                    '<div style="grid-column:1/-1">' + field({ id: "af-bible-prompt", label: "Pertanyaan renungan", value: config?.reflection_prompt || "Apa pesan utama bacaan ini?" }) + "</div>" +
                    field({ id: "af-bible-min", label: "Minimal karakter jawaban", type: "number", value: config?.reflection_min_length ?? 100, attrs: "min=0" }) +
                    "</div>",
                footer: '<button class="btn ghost" type="button" data-close>Batal</button>' +
                    '<button class="btn" type="button" data-save data-busy-label="Menyimpan...">' + (editing ? "Simpan perubahan" : "Buat kegiatan") + "</button>"

            const syncSections = () => {
                const type = val("af-type");
                $("#af-once").style.display = type === "one_time" ? "" : "none";
                $("#af-repeat").style.display = type === "recurring" ? "" : "none";
                const mode = val("af-bible-mode");
                $("#af-bible").style.display = mode === "none" ? "none" : "";
                $("#af-bible-version").closest(".field").style.display = mode === "none" ? "none" : "";
                $("#af-bible-prompt").closest(".field").parentElement.style.display = mode === "reflection" ? "" : "none";
                $("#af-bible-min").closest(".field").style.display = mode === "reflection" ? "" : "none";
            };
            $("#af-type").value = item?.activity_type || "one_time";
            $("#af-status").value = item?.status || "draft";
            $("#af-frequency").value = item?.schedule?.frequency || "weekly";
            $("#af-bible-mode").value = config ? (config.requires_reflection ? "reflection" : "reading") : "none";
            $("#af-type").onchange = syncSections;
            $("#af-bible-mode").onchange = syncSections;
            syncSections();

            loadCategories(item?.category_id);
            loadBibleSelectors(config);

            $("[data-close]", modal.el).onclick = () => modal.close();
            $("[data-save]", modal.el).onclick = event => withBusy(event.currentTarget, () => saveActivity(item?.uuid || "", modal));
        }

        async function loadCategories(selected) {
            try {
                const items = listOf(await api("/activity-categories"));
                const select = $("#af-category");
                if (!select) return;
                select.innerHTML = items.length
                    ? optionList(items, selected, { value: "id", text: "name" })
                    : '<option value="">Belum ada kategori</option>';
                if (selected) select.value = String(selected);
            } catch (error) { toastError(error); }
        }

        async function loadBibleSelectors(config) {
            try {
                const versions = listOf(await api("/bible/versions"));
                const versionSelect = $("#af-bible-version");
                if (!versionSelect) return;
                versionSelect.innerHTML = optionList(versions.length ? versions : [{ code: "tb", name: "Terjemahan Baru" }], config?.version_code || "tb");
                const fillBooks = async () => {
                    const books = listOf(await api("/bible/books?version=" + encodeURIComponent(versionSelect.value)));
                    const bookSelect = $("#af-bible-book");
                    if (bookSelect) bookSelect.innerHTML = books.length ? optionList(books, config?.book_code) : '<option value="">Tidak ada kitab</option>';
                };
                versionSelect.onchange = () => fillBooks().catch(toastError);
                await fillBooks();
            } catch (error) { toastError(error); }
        }

        async function saveActivity(uuid, modal) {
            const type = val("af-type");
            const mode = val("af-bible-mode");
            const payload = {
                title: val("af-title"),
                description: val("af-description") || null,
                category_id: num(val("af-category"), 0),
                activity_type: type,
                status: val("af-status"),
                streak_enabled: true,
                streak_type: "daily_activity",
                streak_points: num(val("af-streak-points"))
            };
            if (!payload.title) return toast("Judul kegiatan wajib diisi.", "warn");
            if (!payload.category_id) return toast("Pilih kategori kegiatan.", "warn");

            if (type === "recurring") {
                const days = val("af-days").split(",").map(part => Number(part.trim())).filter(day => Number.isInteger(day) && day >= 0 && day <= 6);
                payload.schedule = {
                    frequency: val("af-frequency") || "weekly",
                    interval_value: Math.max(1, num(val("af-interval"), 1)),
                    days_of_week: days.length ? days : [0],
                    start_date: val("af-start-date") || todayISO(),
                    start_time: val("af-start-time") || "09:00",
                    end_time: val("af-end-time") || "11:00",
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jakarta"
                };
            } else {
                payload.occurrence = {
                    starts_at: val("af-starts") ? new Date(val("af-starts")).toISOString() : new Date().toISOString(),
                    location: val("af-location") || null,
                    status: "scheduled"
                };
            }

            let bibleConfig = null;
            if (mode !== "none") {
                bibleConfig = {
                    version_code: val("af-bible-version"),
                    book_code: val("af-bible-book"),
                    start_chapter: num(val("af-bible-sc"), 1),
                    start_verse: num(val("af-bible-sv"), 1),
                    end_chapter: num(val("af-bible-ec"), 1),
                    end_verse: num(val("af-bible-ev"), 1),
                    requires_reflection: mode === "reflection",
                    reflection_prompt: mode === "reflection" ? val("af-bible-prompt") : "",
                    reflection_min_length: mode === "reflection" ? Math.max(1, num(val("af-bible-min"), 100)) : 0
                };
                if (!bibleConfig.book_code) return toast("Pilih kitab untuk bacaan Alkitab.", "warn");
                if (bibleConfig.end_chapter < bibleConfig.start_chapter) return toast("Pasal akhir tidak boleh sebelum pasal awal.", "warn");
                payload.bible_config = bibleConfig;
            }

            try {
                const result = dataOf(await api(uuid ? "/admin/activities/" + encodeURIComponent(uuid) : "/admin/activities", {
                    method: uuid ? "PATCH" : "POST",
                    body: JSON.stringify(payload)
                }));
                const savedUUID = uuid || result.uuid;
                if (savedUUID && bibleConfig) {
                    try { await api("/admin/activities/" + encodeURIComponent(savedUUID) + "/bible-config", { method: "PATCH", body: JSON.stringify(bibleConfig) }); }
                    catch (error) { toast("Kegiatan tersimpan, tapi konfigurasi bacaan gagal: " + error.message, "warn"); }
                }
                const image = fileOf("af-image");
                if (savedUUID && image) {
                    try { await uploadImage("/admin/activities/" + encodeURIComponent(savedUUID) + "/image", image); }
                    catch (error) { toast("Kegiatan tersimpan, tapi foto gagal diunggah: " + error.message, "warn"); }
                }
                modal.close();
                toast(uuid ? "Perubahan kegiatan disimpan." : "Kegiatan dibuat.");
                loadActivities();
            } catch (error) { toastError(error); }
        }

        /* ---------- bacaan Alkitab di dalam kegiatan ---------- */
        ACTIONS["bible-task"] = ({ uuid }) => openBibleTask(uuid);

        async function openBibleTask(uuid) {
            const page = $("#page");
            page.innerHTML = skeleton(5);
            try {
                const activity = dataOf(await api("/activities/" + encodeURIComponent(uuid)));
                const config = activity.bible_config;
                if (!config) {
                    toast("Kegiatan ini tidak punya bacaan Alkitab.", "warn");
                    return navigate("activities");
                }
                const start = num(config.start_chapter, 1), end = Math.max(start, num(config.end_chapter, start));
                const chapters = [];
                for (let chapter = start; chapter <= Math.min(end, start + 9); chapter++) {
                    const result = dataOf(await api("/bible/" + encodeURIComponent(config.version_code) + "/" + encodeURIComponent(config.book_code) + "/" + chapter));
                    const verses = (result.verses || []).filter(verse => {
                        const no = num(verse.verse);
                        if (chapter === start && no < num(config.start_verse, 1)) return false;
                        if (chapter === end && num(config.end_verse) && no > num(config.end_verse)) return false;
                        return true;
                    });
                    chapters.push({ title: (result.book?.name || config.book_code) + " " + chapter, verses });
                }
                const reference = config.book_code + " " + start + ":" + num(config.start_verse, 1) + "–" + end + ":" + num(config.end_verse, 1);
                page.innerHTML =
                    '<div class="page-head"><div><button class="btn quiet" type="button" data-act="go" data-page="activities">' + icon("left", 15) + " Kembali ke kegiatan</button>" +
                    "<h1>" + h(activity.title) + "</h1><p>Bacaan " + h(reference) + "</p></div></div>" +
                    '<article class="card">' +
                    chapters.map(chapter => '<h2 style="margin:18px 0 10px">' + h(chapter.title) + "</h2>" +
                        '<div class="scripture">' + (chapter.verses.length
                            ? chapter.verses.map(verse => '<p><span class="v-no">' + h(verse.verse) + "</span>" + h(verse.text) + "</p>").join("")
                            : '<p class="muted">Ayat tidak tersedia.</p>') + "</div>").join("") +
                    '<div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px">' +
                    (config.requires_reflection
                        ? "<h3>" + h(config.reflection_prompt || "Apa kesimpulan Anda?") + "</h3>" +
                        '<p class="muted small">Minimal ' + num(config.reflection_min_length, 1) + ' karakter.</p>' +
                        '<textarea id="reflection" placeholder="Tulis kesimpulan Anda..."></textarea>' +
                        '<div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="submit-task" data-uuid="' + h(uuid) + '" data-min="' + num(config.reflection_min_length, 1) + '" data-busy-label="Mengirim...">Kirim kesimpulan</button>' +
                        '<span class="small muted" id="reflection-count">0 karakter</span></div>'
                        : '<button class="btn" type="button" data-act="submit-task" data-uuid="' + h(uuid) + '" data-min="0" data-busy-label="Menyimpan...">Tandai selesai dibaca</button>') +
                    "</div></article>";
                const area = $("#reflection");
                if (area) area.addEventListener("input", () => { $("#reflection-count").textContent = area.value.trim().length + " karakter"; });
            } catch (error) {
                page.innerHTML = '<div class="card">' + emptyState("Bacaan gagal dibuka", error.message,
                    '<button class="btn ghost" type="button" data-act="go" data-page="activities" style="margin-top:10px">Kembali ke kegiatan</button>') + "</div>";
            }
        }

        ACTIONS["submit-task"] = async ({ uuid, min }, button) => {
            const answer = $("#reflection")?.value.trim() || null;
            const minimum = num(min);
            if (minimum && (!answer || answer.length < minimum)) {
                return toast("Kesimpulan masih kurang dari " + minimum + " karakter.", "warn");
            }
            await withBusy(button, async () => {
                try {
                    await api("/activities/" + encodeURIComponent(uuid) + "/submit", { method: "POST", body: JSON.stringify({ answer_text: answer }) });
                    toast("Terkirim. Admin akan meninjau renungan Anda.");
                    navigate("tasks");
                } catch (error) { toastError(error); }
            });
        };

         * 15. Renungan saya

                    (items.length ? items.map(item => "<tr>" +

                        "<td>" + statusBadge(item.status) + "</td>" +
