        /* =======================================================================
         * 16. Absensi saya
         * ===================================================================== */
        async function pageAttendance(seq) {
            const [summaryRes, historyRes] = await Promise.allSettled([
                api("/attendance/summary"),
                api("/attendance/me?limit=" + CONFIG.PAGE_SIZE)
            ]);
            if (seq !== state.seq) return;
            const summary = summaryRes.status === "fulfilled" ? dataOf(summaryRes.value) : {};
            const records = historyRes.status === "fulfilled" ? listOf(historyRes.value) : [];
            const cards = [
                ["Hadir", summary.present, "ok"], ["Terlambat", summary.late, "warn"],
                ["Izin", summary.excused, ""], ["Tidak hadir", summary.absent, "bad"]
            ];
            paint(seq, head(ROUTES.attendance) +
                '<div class="grid g4">' + cards.map(([label, value]) =>
                    '<div class="card metric"><div class="k">' + label + '</div><div class="v">' + num(value) + "</div></div>").join("") + "</div>" +
                '<div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Tanggal</th><th>Status</th><th>Kegiatan</th><th>Point</th><th>Catatan</th></tr></thead><tbody>' +
                (records.length ? records.map(item => "<tr>" +
                    "<td>" + fmtDate(item.attendance_date) + "</td>" +

        ACTIONS["news-refresh"] = () => loadNews();

        async function loadNews() {
            const host = $("#news-list");
            if (!host) return;
            host.innerHTML = skeleton(3);
            const params = new URLSearchParams({ limit: String(CONFIG.PAGE_SIZE) });
            const status = isAdmin() ? val("news-status") : "published";
            if (status) params.set("status", status);
            if (val("news-search")) params.set("search", val("news-search"));
            try {
                const items = listOf(await api("/news?" + params.toString()))
                    .filter(item => isAdmin() || item.status === "published");
                items.forEach(item => state.cache.set(item.uuid, item));
                if (!isAdmin()) {
                    host.innerHTML = items.length ? '<div class="grid g2">' + items.map(item =>
                        '<article class="card">' +
                        (item.image_url ? '<img src="' + h(mediaURL(item.image_url)) + '" alt="" loading="lazy" style="width:100%;height:170px;object-fit:cover;border-radius:10px;margin-bottom:12px">' : "") +
                        (item.is_featured ? '<span class="badge brass">Sorotan</span>' : "") +
                        "<h3 style=\"margin-top:8px\">" + h(item.title) + "</h3>" +
                        '<p class="muted small">' + fmtDate(item.published_at || item.created_at) + "</p>" +
                        "<p>" + h(item.excerpt || String(item.content || "").slice(0, 180)) + "</p>" +
                        '<button class="btn ghost sm" type="button" data-act="news-read" data-uuid="' + h(item.uuid) + '">Baca selengkapnya</button>' +
                        "</article>").join("") + "</div>"
                        : '<div class="card">' + emptyState("Belum ada berita", "Pengumuman jemaat akan muncul di sini.") + "</div>";
                    return;
                }
                host.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Berita</th><th>Slug</th><th>Status</th><th>Sorotan</th><th>Dilihat</th><th>Tindakan</th></tr></thead><tbody>' +
                    (items.length ? items.map(item => "<tr>" +
                        '<td><div style="display:flex;gap:10px;align-items:center;min-width:240px">' + thumb(item.image_url, item.title) +
                        '<div style="white-space:normal"><strong>' + h(item.title) + "</strong>" +
                        (item.excerpt ? '<div class="small muted">' + h(String(item.excerpt).slice(0, 90)) + "</div>" : "") + "</div></div></td>" +
                        "<td><code>" + h(item.slug) + "</code></td><td>" + statusBadge(item.status) + "</td>" +
                        "<td>" + (item.is_featured ? '<span class="badge brass">Ya</span>' : '<span class="muted">-</span>') + "</td>" +
                        "<td>" + num(item.views) + "</td>" +
                        '<td><div class="actions">' +
                        '<button class="btn ghost sm" type="button" data-act="news-read" data-uuid="' + h(item.uuid) + '">Pratinjau</button>' +
                        '<button class="btn ghost sm" type="button" data-act="news-edit" data-uuid="' + h(item.uuid) + '" aria-label="Ubah berita">' + icon("edit", 15) + "</button>" +
                        '<button class="btn ghost sm" type="button" data-act="news-delete" data-uuid="' + h(item.uuid) + '" aria-label="Hapus berita">' + icon("trash", 15) + "</button>" +
                        "</div></td></tr>").join("") : emptyRow(6, "Belum ada berita.")) + "</tbody></table></div>";
            } catch (error) {
                host.innerHTML = '<div class="card">' + emptyState("Berita gagal dimuat", error.message,
                    '<button class="btn ghost" type="button" data-act="news-refresh" style="margin-top:10px">Coba lagi</button>') + "</div>";
            }
        }

        ACTIONS["news-read"] = ({ uuid }) => {
            const item = state.cache.get(uuid);
            if (!item) return;
            const modal = openModal({
                title: item.title,
                subtitle: fmtDate(item.published_at || item.created_at) + (item.status !== "published" ? " · belum terbit" : ""),
                body: (item.image_url ? '<img src="' + h(mediaURL(item.image_url)) + '" alt="" style="width:100%;border-radius:10px">' : "") +
                    '<div style="white-space:pre-wrap;line-height:1.7">' + h(item.content || item.excerpt || "Isi berita belum ditulis.") + "</div>",
                footer: '<button class="btn ghost" type="button" data-close>Tutup</button>'
            });
            $("[data-close]", modal.el).onclick = () => modal.close();
        };

        ACTIONS["news-new"] = () => openNewsForm(null);
        ACTIONS["news-edit"] = ({ uuid }) => openNewsForm(state.cache.get(uuid) || null);
        ACTIONS["news-delete"] = async ({ uuid }) => {
            const item = state.cache.get(uuid);
            const ok = await askConfirm({
                title: "Hapus berita ini?", message: "“" + (item?.title || uuid) + "” akan hilang dari daftar.",
                confirmText: "Hapus berita", danger: true
            });
            if (!ok) return;
            try { await api("/admin/news/" + encodeURIComponent(uuid), { method: "DELETE" }); toast("Berita dihapus."); loadNews(); }

        function openNewsForm(item) {
            const editing = Boolean(item?.uuid);
            const modal = openModal({
                title: editing ? "Ubah berita" : "Tulis berita",
                subtitle: "Slug dibuat otomatis dari judul dan masih bisa Anda ubah.",
                body: '<div class="grid g2">' +
                    '<div style="grid-column:1/-1">' + field({ id: "nf-title", label: "Judul", value: item?.title || "" }) + "</div>" +
                    field({ id: "nf-slug", label: "Slug", value: item?.slug || "", placeholder: "kabar-jemaat-oktober" }) +
                    field({ id: "nf-status", label: "Status", options: '<option value="draft">Draf</option><option value="published">Terbit</option>' }) +
                    field({ id: "nf-published", label: "Tayang pada", type: "datetime-local", value: localInputValue(item?.published_at) }) +
                    field({ id: "nf-site", label: "Site ID", type: "number", value: item?.site_id ?? "", placeholder: "Opsional" }) +
                    field({ id: "nf-author", label: "Author ID", type: "number", value: item?.author_id ?? state.user?.id ?? "", placeholder: "Opsional" }) +
                    field({ id: "nf-image", label: "Gambar sampul", type: "file", attrs: 'accept="image/jpeg,image/png,image/webp"' }) +
                    '<div style="grid-column:1/-1">' + field({ id: "nf-excerpt", label: "Ringkasan", value: item?.excerpt || "", hint: "Tampil di kartu berita." }) + "</div>" +
                    '<div style="grid-column:1/-1">' + field({ id: "nf-content", label: "Isi berita", type: "textarea", value: item?.content || "", rows: 10 }) + "</div>" +
                    field({ id: "nf-meta", label: "Meta JSON", type: "textarea", value: item?.meta ? (typeof item.meta === "string" ? item.meta : JSON.stringify(item.meta)) : "", placeholder: '{"source":"internal"}' }) +
                    field({ id: "nf-featured", label: "Sorotan", type: "checkbox", value: Boolean(item?.is_featured), placeholder: "Tampilkan sebagai berita sorotan" }) +
                    "</div>",
                footer: '<button class="btn ghost" type="button" data-close>Batal</button>' +
                    '<button class="btn" type="button" data-save data-busy-label="Menyimpan...">' + (editing ? "Simpan perubahan" : "Simpan berita") + "</button>"
            });
            $("#nf-status").value = item?.status || "draft";
            $("#nf-title").addEventListener("input", event => {
                const slug = $("#nf-slug");
                if (!slug.dataset.touched) slug.value = slugify(event.target.value);
            });
            $("#nf-slug").addEventListener("input", event => { event.target.dataset.touched = "1"; });
            $("[data-close]", modal.el).onclick = () => modal.close();
            $("[data-save]", modal.el).onclick = event => withBusy(event.currentTarget, () => saveNews(item?.uuid || "", modal));
        }

        async function saveNews(uuid, modal) {
            let meta = null;
            const rawMeta = val("nf-meta");
            if (rawMeta) {
                try { meta = JSON.parse(rawMeta); }
                catch (_) { return toast("Meta JSON belum valid. Periksa tanda kutip dan koma.", "warn"); }
            }
            const payload = {
                title: val("nf-title"),
                slug: val("nf-slug") || slugify(val("nf-title")),
                excerpt: val("nf-excerpt") || null,
                content: val("nf-content"),
                author_id: intOrNull("nf-author"),
                site_id: intOrNull("nf-site"),
                status: val("nf-status"),
                is_featured: checked("nf-featured"),
                meta,
                published_at: val("nf-published") ? new Date(val("nf-published")).toISOString() : null
            };
            if (!payload.title || !payload.content) return toast("Judul dan isi berita wajib diisi.", "warn");
            try {
                const result = dataOf(await api(uuid ? "/admin/news/" + encodeURIComponent(uuid) : "/admin/news", {
                    method: uuid ? "PATCH" : "POST", body: JSON.stringify(payload)
                }));
                const savedUUID = uuid || result.uuid;
                const image = fileOf("nf-image");
                if (savedUUID && image) {
                    try { await uploadImage("/admin/news/" + encodeURIComponent(savedUUID) + "/image", image); }
                    catch (error) { toast("Berita tersimpan, tapi gambar gagal diunggah: " + error.message, "warn"); }
                }
                modal.close();
                toast(uuid ? "Perubahan berita disimpan." : "Berita dibuat.");
                loadNews();
            } catch (error) { toastError(error); }
        }

            try {
                const result = dataOf(await api("/admin/rewards", { method: "POST", body: JSON.stringify(payload) }));
                const image = fileOf("rf-image");
                if (image && result.uuid) {
                    try { await uploadImage("/admin/rewards/" + encodeURIComponent(result.uuid) + "/image", image); }
                    catch (error) { toast("Reward tersimpan, tapi foto gagal diunggah: " + error.message, "warn"); }
                }
                toast("Reward ditambahkan.");
                adminRewards();
            } catch (error) { toastError(error); }
        });
        ACTIONS["reward-toggle"] = async ({ uuid, status }, button) => withBusy(button, async () => {
            try {
                await api("/admin/rewards/" + encodeURIComponent(uuid), {
                    method: "PATCH", body: JSON.stringify({ status: status === "active" ? "inactive" : "active" })
                });
                toast("Status reward diperbarui.");
                adminRewards();
            } catch (error) { toastError(error); }
        });

        /* ---------- penukaran ---------- */
        async function adminRedemptions() {
            adminLoading();
            try {
                const items = listOf(await api("/admin/reward-redemptions"));
                adminPanel('<div class="table-wrap"><table><thead><tr><th>Jemaat</th><th>Reward</th><th>Point</th><th>Status</th><th>Kode</th><th>Tindakan</th></tr></thead><tbody>' +
                    (items.length ? items.map(item => "<tr><td>" + h(item.user_email) + "</td><td>" + h(item.reward_name) + "</td>" +
                        "<td>" + num(item.points_required) + "</td><td>" + statusBadge(item.status) + "</td>" +
                        "<td>" + (item.status === "approved"
                            ? '<div class="small">Jemaat <code>' + h(item.user_code) + "</code><br>Admin <code>" + h(item.admin_code) + "</code></div>" : "-") + "</td>" +
                        '<td><div class="actions">' + (item.status === "pending"
                            ? '<button class="btn sm" type="button" data-act="redeem-approve" data-uuid="' + h(item.uuid) + '">Setujui</button>' +
                            '<button class="btn ghost sm" type="button" data-act="redeem-reject" data-uuid="' + h(item.uuid) + '">Tolak</button>'
                            : item.status === "approved"
                                ? '<button class="btn sm" type="button" data-act="redeem-complete" data-uuid="' + h(item.uuid) + '">Serahkan reward</button>'
                                : '<span class="muted">-</span>') + "</div></td></tr>").join("")
                        : emptyRow(6, "Belum ada permintaan penukaran.")) + "</tbody></table></div>");
            } catch (error) { adminPanel('<div class="card">' + emptyState("Data penukaran gagal dimuat", error.message) + "</div>"); }
        }
        ACTIONS["redeem-approve"] = async ({ uuid }) => {
            const note = await askInput({
                title: "Setujui penukaran", label: "Catatan untuk jemaat", value: "Silakan ambil reward di sekretariat gereja.",
                message: "Catatan ini tampil di halaman reward jemaat.", confirmText: "Setujui"
            });
            if (note === null) return;
            try {
                const result = dataOf(await api("/admin/reward-redemptions/" + encodeURIComponent(uuid) + "/approve", {
                    method: "POST", body: JSON.stringify({ note: note || null })
                }));
                toast("Disetujui. Kode jemaat " + (result.user_code || "-") + ", kode admin " + (result.admin_code || "-") + ".");
                adminRedemptions();
            } catch (error) { toastError(error); }
        };
        ACTIONS["redeem-reject"] = async ({ uuid }) => {
            const note = await askInput({
                title: "Tolak penukaran", label: "Alasan penolakan", required: true, multiline: true,
                message: "Point jemaat akan dikembalikan otomatis.", confirmText: "Tolak penukaran"
            });
            if (!note) return;
            try {
                await api("/admin/reward-redemptions/" + encodeURIComponent(uuid) + "/reject", { method: "POST", body: JSON.stringify({ note }) });
                toast("Penukaran ditolak dan point dikembalikan.");
                adminRedemptions();
            } catch (error) { toastError(error); }
        };
        ACTIONS["redeem-complete"] = async ({ uuid }) => {
            const userCode = await askInput({ title: "Serahkan reward", label: "Kode dari jemaat", required: true, confirmText: "Lanjut" });
            if (!userCode) return;
            const adminCode = await askInput({ title: "Konfirmasi admin", label: "Kode admin", required: true, confirmText: "Serahkan" });
            if (!adminCode) return;
            try {
                await api("/admin/reward-redemptions/" + encodeURIComponent(uuid) + "/complete", {
                    method: "POST", body: JSON.stringify({ user_code: userCode, admin_code: adminCode })
                });
                toast("Reward diserahkan dan penukaran ditutup.");
                adminRedemptions();
            } catch (error) { toastError(error); }
        };

        /* ---------- review renungan ---------- */
        async function adminSubmissions() {
            adminLoading();
            try {
                const items = listOf(await api("/admin/activity-submissions?status=submitted"));
                adminPanel('<div class="table-wrap"><table><thead><tr><th>Jemaat</th><th>Kegiatan</th><th>Jawaban</th><th>Dikirim</th><th>Tindakan</th></tr></thead><tbody>' +
                    (items.length ? items.map(item => "<tr><td>" + h(item.user_email) + "</td><td>" + h(item.activity_title) + "</td>" +
                        '<td style="white-space:normal;min-width:280px">' + h(item.answer_text || "Selesai dibaca") + "</td>" +
                        "<td>" + fmtDateTime(item.submitted_at) + "</td>" +
                        '<td><div class="actions">' +
                        '<button class="btn sm" type="button" data-act="review-task" data-uuid="' + h(item.uuid) + '" data-ok="1">Setujui</button>' +
                        '<button class="btn ghost sm" type="button" data-act="review-task" data-uuid="' + h(item.uuid) + '" data-ok="">Tolak</button>' +
                        "</div></td></tr>").join("")
                        : emptyRow(5, "Tidak ada renungan yang menunggu review.")) + "</tbody></table></div>");
            } catch (error) { adminPanel('<div class="card">' + emptyState("Data renungan gagal dimuat", error.message) + "</div>"); }
        }
        ACTIONS["review-task"] = async ({ uuid, ok }) => {
            const approve = Boolean(ok);
            const note = await askInput({
                title: approve ? "Setujui renungan" : "Tolak renungan",
                label: approve ? "Catatan untuk jemaat" : "Alasan penolakan",
                value: approve ? "Bacaan dan kesimpulan diterima." : "",
                required: !approve, multiline: true,
                confirmText: approve ? "Setujui" : "Tolak"
            });
            if (note === null || (!approve && !note)) return;
            try {
                await api("/admin/activity-submissions/" + encodeURIComponent(uuid) + "/" + (approve ? "approve" : "reject"), {
                    method: "POST", body: JSON.stringify({ note: note || null })
                });
                toast(approve ? "Renungan disetujui." : "Renungan ditolak.");
                adminSubmissions();
            } catch (error) { toastError(error); }
        };

        /* ---------- role ---------- */
        async function adminRoles() {
            adminLoading();
            try {
                const items = listOf(await api("/admin/roles"));
                adminPanel('<div class="card"><h2>Role yang tersedia</h2>' +
                    '<p class="muted small">Role menentukan menu dan tindakan yang bisa diakses anggota.</p>' +
                    (items.length ? '<div class="grid g3" style="margin-top:12px">' + items.map(item =>
                        '<div class="card" style="box-shadow:none"><strong>' + h(item.name) + '</strong><div style="margin-top:6px"><span class="badge brand">' + h(item.code) + "</span></div>" +
                        (item.description ? '<p class="muted small" style="margin-top:8px">' + h(item.description) + "</p>" : "") + "</div>").join("") + "</div>"
                        : emptyState("Belum ada role", "Tambahkan role dari sisi server.")) + "</div>");
            } catch (error) { adminPanel('<div class="card">' + emptyState("Role gagal dimuat", error.message) + "</div>"); }
        }

        /* =======================================================================
         * 22. Laporan absensi (admin)
         * ===================================================================== */
        async function pageAdminAttendance(seq) {
            paint(seq, head(ROUTES.report) +
                '<div class="card"><div class="toolbar">' +
                field({ id: "rep-date", label: "Tanggal", type: "date", value: todayISO() }) +
                '<button class="btn" type="button" data-act="report-load">Muat laporan</button>' +
                "</div></div><div id=\"report-view\" style=\"margin-top:16px\"></div>");
            if (seq !== state.seq) return;
            $("#rep-date").onchange = () => ACTIONS["report-load"]();
            await loadAdminAttendance();
        }
        ACTIONS["report-load"] = () => loadAdminAttendance();

        async function loadAdminAttendance() {
            const host = $("#report-view");
            if (!host) return;
            host.innerHTML = skeleton(4);
            const date = val("rep-date") || todayISO();
            try {
                const [summaryRes, listRes] = await Promise.all([
                    api("/admin/attendance/summary?date=" + encodeURIComponent(date)),
                    api("/admin/attendance?date=" + encodeURIComponent(date) + "&limit=100")
                ]);
                const summary = dataOf(summaryRes);
                const items = listOf(listRes);
                host.innerHTML = '<div class="grid g4">' +
                    [["Total anggota", summary.total_users], ["Hadir", summary.present], ["Terlambat", summary.late], ["Tidak hadir", summary.absent]]
                        .map(([label, value]) => '<div class="card metric"><div class="k">' + label + '</div><div class="v">' + num(value) + "</div></div>").join("") +
                    "</div>" +
                    '<div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Nama</th><th>Email</th><th>Kegiatan</th><th>Status</th><th>Jam</th><th>Point</th></tr></thead><tbody>' +
                    (items.length ? items.map(item => "<tr><td>" + h(item.full_name) + "</td><td>" + h(item.email) + "</td>" +
                        "<td>" + h(item.activity_title || item.activity_id || "-") + "</td><td>" + statusBadge(item.status) + "</td>" +
                        "<td>" + (item.checked_in_at ? fmtDateTime(item.checked_in_at) : "-") + "</td><td>" + num(item.points_earned) + "</td></tr>").join("")
                        : emptyRow(6, "Belum ada absensi pada tanggal ini.")) + "</tbody></table></div>";
            } catch (error) {
                host.innerHTML = '<div class="card">' + emptyState("Laporan gagal dimuat", error.message,
                    '<button class="btn ghost" type="button" data-act="report-load" style="margin-top:10px">Coba lagi</button>') + "</div>";
            }
        }

        /* =======================================================================
         * 23. Start
         * ===================================================================== */
        applyTheme();
        state.page = routeOf(location.hash.replace(/^#\/?/, "") || "dashboard");
        if (state.token && state.user) renderApp(); else renderAuth();
    </script>
</body>

</html>
